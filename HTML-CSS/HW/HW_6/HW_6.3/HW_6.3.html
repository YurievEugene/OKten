<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="login-box">
        <h1 class="logo">Instagram</h1>
        
        <form>
            <input type="text" class="input-field" placeholder="Номер телефону, ім'я користувача або е...">
            <input type="password" class="input-field" placeholder="Пароль">
            
            <button type="submit" class="login-button">Увійти</button>
        </form>

        <div class="or">АБО</div>

        <button class="facebook-login">
            <span class="facebook-icon"></span>
            Увійти через Facebook
        </button>

        <a href="#" class="forgot-password">Забули пароль?</a>
    </div>

    <div class="signup-box">
        Не маєте облікового запису? <a href="#">Зареєструйтеся</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .wrapper{
            display: grid;
            height: 100vh;
            background: grey;
            grid-template-columns: 1fr 2fr 1fr; /*скільки колонок треба стільки значень й вводиш*/
            grid-template-rows: repeat(3, 1fr);
            grid-row-gap: 50px;
        }
        .item{
            background: lightcoral;
            border: 1px solid;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper div:nth-child(5){
            background-color: aliceblue;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="item">
            <p>Lorem ipsum dolor sit amet.</p>
        </div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
